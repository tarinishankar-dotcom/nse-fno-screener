name: NSE FNO Screener

on:
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install pandas requests openchart

      # --------------------------------------------------
      # STEP 1 - CREATE CURRENT 210 STOCK FUTURES CSV
      # --------------------------------------------------

      - name: Discover NSE F&O Futures
        run: |
          python test_openchart.py

      # --------------------------------------------------
      # CHECK CSV
      # --------------------------------------------------

      - name: Verify futures CSV
        run: |
          echo "Checking stock_futures.csv..."
          ls -lh
          echo "--------------------------------"
          head -10 stock_futures.csv
          echo "--------------------------------"
          echo "TOTAL STOCK FUTURES:"
          python -c "import pandas as pd; print(len(pd.read_csv('stock_futures.csv')))"

      # --------------------------------------------------
      # STEP 2 - RUN SCREENER
      # --------------------------------------------------

      - name: Run NSE FNO Screener
        run: |
          python test_screener.py

      # --------------------------------------------------
      # SAVE RESULT
      # --------------------------------------------------

      - name: Upload Screener Result
        uses: actions/upload-artifact@v4
        with:
          name: nse-fno-screener-result
          path: |
            screener_results.csv
            stock_futures.csv
            current_futures.csv
            index_futures.csv
