name: NSE FNO Screener

on:
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install pandas requests openchart

      - name: Run NSE F&O Screener
        run: |
          python test_screener.py

      - name: Show Results
        run: |
          echo "=============================================="
          echo "SCREENER COMPLETE"
          echo "=============================================="
          if [ -f screener_results.csv ]; then
            echo "Result file created:"
            ls -lh screener_results.csv
            echo ""
            echo "RESULT:"
            cat screener_results.csv
          else
            echo "ERROR: screener_results.csv NOT FOUND"
            exit 1
          fi
